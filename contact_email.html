<!DOCTYPE html>
<html>
<head>
    <style>
        .email-container { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: auto; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .header { background: #1e40af; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; color: #334155; line-height: 1.6; }
        .field { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #f1f5f9; }
        .label { font-weight: bold; color: #1e40af; display: block; font-size: 12px; text-transform: uppercase; }
        .footer { background: #f8fafc; padding: 15px; text-align: center; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h2>RoopHub Support Notification</h2>
        </div>
        <div class="content">
            <p>Hello Admin, you have received a new message from the contact form.</p>
            
            <div class="field">
                <span class="label">From:</span>
                <strong>{{ name }}</strong> ({{ email }})
            </div>
            
            <div class="field">
                <span class="label">Subject:</span>
                {{ subject }}
            </div>
            
            <div class="field">
                <span class="label">Message:</span>
                <p>{{ message }}</p>
            </div>
        </div>
        <div class="footer">
            This is an automated email from roophub.online
        </div>
    </div>
</body>
</html>
